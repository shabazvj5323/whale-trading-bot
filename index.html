<!DOCTYPE html>
<html>
<head>
<style>
    body { background: #08090c; color: white; font-family: monospace; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: left; }
</style>
</head>
<body>
    <h1>WhaleTrader Pro</h1>
    <div style="background:#111; padding:10px; border-radius:5px;">
        <div>Live Clock: <span id="clock" style="color:#00ff00;"></span></div>
        <div>Last Sync Time: 2026-06-22 04:23:53 PM</div>
        <div id="timer" style="color: yellow; font-size: 20px; font-weight:bold;">Next Sync In: 15:00</div>
    </div>
    <table><tr><th>Asset</th><th>Signal</th><th>RSI</th><th>Entry</th></tr></table>
    <h3>Settlement Log</h3>
    <table><tr><th>Time</th><th>Asset</th><th>P&L</th></tr><tr><td>2026-06-22 14:04</td><td>BTC/USDT</td><td>44.49</td></tr><tr><td>2026-06-22 14:45</td><td>BTC/USDT</td><td>-11.84</td></tr><tr><td>06-22 14:56</td><td>BTC/USDT</td><td>1.01</td></tr><tr><td>06-22 14:56</td><td>PAXG/USDT</td><td>6.09</td></tr><tr><td>06-22 16:08</td><td>ETH/USDT</td><td>1.44</td></tr></table>
    <script>
        setInterval(()=>{ document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        let t = 900;
        setInterval(()=>{
            t--;
            let m = Math.floor(t/60), s = t%60;
            document.getElementById('timer').innerText = "Next Sync In: " + m + ":" + (s<10?'0':'') + s;
            if(t <= 0) location.reload();
        }, 1000);
    </script>
</body>
</html>
