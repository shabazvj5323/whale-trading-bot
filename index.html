<!DOCTYPE html>
<html>
<head>
<style>
    body { font-family: sans-serif; background-color: #08090c; color: #cbd5e1; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; }
    h1 { color: #ffffff; }
    table { width: 100%; border-collapse: collapse; background: #0b0d13; border: 1px solid #1e293b; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1e293b; }
</style>
</head>
<body>
    <div class="header">
        <h1>WhaleTrader Pro Terminal</h1>
        <div style="text-align:right;">
            <div>Live: <span id="clock" style="color:white; font-weight:bold;">--:--:--</span></div>
            <div>Last Sync: 2026-06-22 04:27:40 PM</div>
            <div id="timer" style="color:#f59e0b; font-weight:bold;">Next Sync In: 15:00</div>
        </div>
    </div>
    <table><tr><th>Asset</th><th>Signal</th><th>RSI</th><th>Entry</th></tr></table>
    <h3>Settlement Log</h3>
    <table><tr><th>Time</th><th>Asset</th><th>P&L</th></tr><tr><td>2026-06-22 14:04</td><td>BTC/USDT</td><td>44.49</td></tr><tr><td>2026-06-22 14:45</td><td>BTC/USDT</td><td>-11.84</td></tr><tr><td>06-22 14:56</td><td>BTC/USDT</td><td>1.01</td></tr><tr><td>06-22 14:56</td><td>PAXG/USDT</td><td>6.09</td></tr><tr><td>06-22 16:08</td><td>ETH/USDT</td><td>1.44</td></tr></table>
    <script>
        setInterval(()=>{ document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        let t = 900;
        setInterval(()=>{
            t--;
            let m = Math.floor(t/60), s = t%60;
            document.getElementById('timer').innerText = "Next Sync In: " + m + ":" + (s<10?'0':'') + s;
            if(t <= 0) location.reload();
        }, 1000);
    </script>
</body>
</html>
