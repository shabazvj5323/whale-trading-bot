name: WhaleTrader Institutional Loop

on:
  schedule:
    - cron: '*/15 * * * *' # Har 15 minute mein automatic chalega
  workflow_dispatch: # Isse aap manually jab chahein button daba kar run kar sakte hain

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Frameworks
      run: |
        python -m pip install --upgrade pip
        pip install requests groq httpx

    - name: Execute Matrix Layer
      env:
        BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
      run: python main.py
      
