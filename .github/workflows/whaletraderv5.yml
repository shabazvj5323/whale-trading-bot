name: WhaleTrader V5 — Ultimate

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  execute-core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Code Pull
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install ccxt numpy requests --quiet

      - name: Run Bot
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: python main.py

      - name: Commit Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot sync V5 — Ultimate [skip ci]"
          file_pattern: 'index.html history.json'
          push_options: '--force'
