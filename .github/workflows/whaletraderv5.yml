name: WhaleTrader Automated Demo Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'  # Har 15 minute mein background automatic run

jobs:
  execute-core:
    runs-on: ubuntu-latest
    steps:
      - name: Code Base Pull
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Environment Spin Up
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Trading Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt numpy requests

      - name: Force Execute Main
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: |
          python main.py
          
